name = "windtp"
main = "src/index.js"
compatibility_date = "2025-01-01"

[vars]
FIREBASE_PROJECT_ID = "windtp-49e64"
ALLOWED_ORIGIN = "https://THAY-BANG-TRANG-WINDTP"

# Dọn dữ liệu hết hạn mỗi ngày lúc 02:17 giờ Việt Nam (19:17 UTC).
[triggers]
crons = ["17 19 * * *"]

[[d1_databases]]
binding = "DB"
database_name = "windtp-db"
database_id = "46d73132-62ff-4eaa-ab37-651a026e7ea8"
migrations_dir = "migrations"

# Kho nội dung thay R2: Workers KV (không cần thẻ quốc tế). Tạo: wrangler kv namespace create CONTENT_KV, rồi điền id vào dòng dưới và bỏ dấu #.
[[kv_namespaces]]
binding = "CONTENT_KV"
id = "df189690c3524ae8bc8a31bfb8d81487"

# R2 chưa tạo (Cloudflare yêu cầu thẻ quốc tế). Khi nào tạo được: wrangler r2 bucket create windtp-content
# rồi bỏ dấu # ở 3 dòng dưới và deploy lại. Chưa có R2 thì máy chủ vẫn chạy, chỉ chưa phát nội dung trả phí/ảnh tải lên.
# [[r2_buckets]]
# binding = "CONTENT"
# bucket_name = "windtp-content"
