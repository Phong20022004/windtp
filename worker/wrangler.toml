name = "windtp-api"
main = "src/index.js"
compatibility_date = "2025-01-01"

[vars]
FIREBASE_PROJECT_ID = "THAY-BANG-PROJECT-ID-FIREBASE"
ALLOWED_ORIGIN = "https://THAY-BANG-TRANG-WINDTP"

[[d1_databases]]
binding = "DB"
database_name = "windtp"
database_id = "THAY-BANG-ID-SAU-KHI-TAO-D1"

# Kho chứa nội dung trả phí (bản đầy đủ của từ vựng). Tạo bằng: wrangler r2 bucket create windtp-content
[[r2_buckets]]
binding = "CONTENT"
bucket_name = "windtp-content"
