name: build
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Cấu hình web Firebase (JSON). Không bắt buộc cho kiểm thử; thiếu thì bỏ qua bước build production.
      WINDTP_FIREBASE_CONFIG: ${{ secrets.WINDTP_FIREBASE_CONFIG }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run build:test
      - run: python3 tools/audit/audit.py
      - run: pip install playwright && playwright install --with-deps chromium
      - run: python3 tests/smoke.py && python3 tests/smoke_auth.py && python3 tests/smoke_data.py && python3 tests/smoke_xss.py && python3 tests/smoke_storage.py
      - name: Build production
        run: |
          if [ -n "$WINDTP_FIREBASE_CONFIG" ] || [ -f firebase.config.json ]; then
            npm run build
          else
            echo "Bỏ qua build production: chưa có cấu hình Firebase (xem README)."
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: WINDTP
          path: |
            dist/index.html
            dist/data
            dist/assets
          if-no-files-found: ignore
